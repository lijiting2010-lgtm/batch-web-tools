<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>记账本 - 简易记账工具</title>
<meta name="description" content="免费在线记账本，简单记录收入和支出。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f7;text-align:center}
header{background:linear-gradient(135deg,#00b894,#55efc4);color:white;padding:30px 20px}
header h1{font-size:26px}
.box{background:white;border-radius:12px;padding:20px;max-width:450px;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.05)}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin:4px 0}
.btn{background:#00b894;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:4px}
.btn2{background:#e74c3c;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:4px}
.list{text-align:left;margin:8px 0;max-height:200px;overflow-y:auto}
.item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.balance{font-size:24px;font-weight:bold;color:#00b894;margin:8px 0}
.pay-bar{background:linear-gradient(135deg,#00b894,#55efc4);color:white;padding:12px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.pay-bar a{color:#ffd700;font-weight:bold;text-decoration:none}
</style></head>
<body>
<header><h1>📒 简易记账本</h1><p>记录每天收支</p></header>
<div class="box">
<div class="balance" id="balance">¥0.00</div>
<select id="type"><option value="income">收入</option><option value="expense">支出</option></select>
<input type="text" id="desc" placeholder="描述...">
<input type="number" id="amount" placeholder="金额..." step="0.01">
<button class="btn" onclick="add()">➕ 添加记录</button>
<button class="btn2" onclick="clearAll()">🗑️ 清空</button>
<div class="list" id="list"></div>
</div>
<div class="pay-bar">💡 觉得好用？<a href="#">请作者喝杯咖啡 ☕</a> | 仅需1元</div>
<script>
function load(){
const data=JSON.parse(localStorage.getItem('moneybook')||'[]');
let b=0;data.forEach(i=>{b+=i.type==='income'?i.amount:-i.amount});
document.getElementById('balance').textContent='¥'+b.toFixed(2);
document.getElementById('balance').style.color=b>=0?'#00b894':'#e74c3c';
const list=document.getElementById('list');
list.innerHTML=data.slice(-10).reverse().map(i=>
'<div class="item"><span>'+i.desc+'</span><span style="color:'+(i.type==='income'?'#00b894':'#e74c3c')+'">'+(i.type==='income'?'+':'-')+'¥'+i.amount.toFixed(2)+'</span></div>'
).join('');
}
function add(){
const type=document.getElementById('type').value;
const desc=document.getElementById('desc').value.trim()||'无描述';
const amount=parseFloat(document.getElementById('amount').value);
if(!amount||amount<=0){alert('请输入有效金额');return;}
const data=JSON.parse(localStorage.getItem('moneybook')||'[]');
data.push({type,desc,amount,date:new Date().toLocaleString()});
localStorage.setItem('moneybook',JSON.stringify(data));
document.getElementById('desc').value='';document.getElementById('amount').value='';
load();
}
function clearAll(){if(confirm('确定清空所有记录？')){localStorage.removeItem('moneybook');load();}}
load();
</script></body></html>
