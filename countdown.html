<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>倒计时工具 - 在线倒计时器</title>
<meta name="description" content="免费在线倒计时工具，设置日期倒计时。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f7;text-align:center}
header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;padding:30px 20px}
header h1{font-size:26px}
.box{background:white;border-radius:12px;padding:20px;max-width:450px;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.05)}
input[type=date]{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px}
.btn{background:#6c5ce7;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:8px}
.cd{font-size:48px;font-weight:bold;font-family:monospace;color:#6c5ce7;margin:16px 0}
.cd span{display:inline-block;margin:0 4px;min-width:40px}
.cd-label{font-size:13px;color:#86868b}
.pay-bar{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;padding:12px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.pay-bar a{color:#ffd700;font-weight:bold;text-decoration:none}
</style></head>
<body>
<header><h1>⏳ 倒计时工具</h1><p>设置目标日期查看剩余时间</p></header>
<div class="box">
<input type="date" id="targetDate">
<button class="btn" onclick="startCountdown()">开始倒计时</button>
<div class="cd" id="display"><span id="days">0</span>天 <span id="hours">0</span>时 <span id="mins">0</span>分 <span id="secs">0</span>秒</div>
<div id="info" class="cd-label">选择目标日期开始</div>
</div>
<div class="pay-bar">💡 觉得好用？<a href="#">请作者喝杯咖啡 ☕</a> | 仅需1元</div>
<script>
let interval=null;
function startCountdown(){
const val=document.getElementById('targetDate').value;
if(!val){document.getElementById('info').textContent='请选择日期';return;}
const target=new Date(val+'T23:59:59');
if(interval)clearInterval(interval);
function tick(){
const now=new Date(),diff=target-now;
if(diff<=0){
document.getElementById('display').innerHTML='🎉 时间到了！';
document.getElementById('info').textContent=val+' 已经到达';
clearInterval(interval);return;
}
const d=Math.floor(diff/86400000);
const h=Math.floor((diff%86400000)/3600000);
const m=Math.floor((diff%3600000)/60000);
const s=Math.floor((diff%60000)/1000);
document.getElementById('days').textContent=d;
document.getElementById('hours').textContent=String(h).padStart(2,'0');
document.getElementById('mins').textContent=String(m).padStart(2,'0');
document.getElementById('secs').textContent=String(s).padStart(2,'0');
document.getElementById('info').textContent='距离 '+val+' 还有';
}
tick();interval=setInterval(tick,1000);
}
// 默认7天后
const d=new Date();d.setDate(d.getDate()+7);
document.getElementById('targetDate').value=d.toISOString().split('T')[0];
</script></body></html>
