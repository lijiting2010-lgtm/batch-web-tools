<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>颜色选择器 - 在线调色板</title>
<meta name="description" content="免费在线颜色选择器，调色板工具，生成配色方案">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f7;text-align:center}
header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;padding:30px 20px}
header h1{font-size:26px}
.box{background:white;border-radius:12px;padding:20px;max-width:500px;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.05)}
input[type=color]{width:80px;height:80px;border:none;cursor:pointer;border-radius:8px;margin:8px}
.color-preview{width:100%;height:60px;border-radius:8px;margin:8px 0;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn{background:#6c5ce7;color:white;border:none;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;margin:4px}
.pay-bar{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;padding:12px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.pay-bar a{color:#ffd700;font-weight:bold;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.color-swatch{width:50px;height:50px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.2s}
.color-swatch:hover{border-color:#6c5ce7;transform:scale(1.1)}
</style></head>
<body>
<header><h1>🎨 颜色选择器</h1><p>选择颜色，获取配色方案</p></header>
<div class="box">
<input type="color" id="colorInput" value="#6c5ce7" oninput="updateColor(this.value)">
<div class="color-preview" id="preview" style="background:#6c5ce7">#6c5ce7</div>
<div class="row">
<div class="color-swatch" style="background:#ff6b6b" onclick="pick('#ff6b6b')"></div>
<div class="color-swatch" style="background:#feca57" onclick="pick('#feca57')"></div>
<div class="color-swatch" style="background:#48dbfb" onclick="pick('#48dbfb')"></div>
<div class="color-swatch" style="background:#ff9ff3" onclick="pick('#ff9ff3')"></div>
<div class="color-swatch" style="background:#54a0ff" onclick="pick('#54a0ff')"></div>
<div class="color-swatch" style="background:#5f27cd" onclick="pick('#5f27cd')"></div>
<div class="color-swatch" style="background:#00d2d3" onclick="pick('#00d2d3')"></div>
<div class="color-swatch" style="background:#ff6348" onclick="pick('#ff6348')"></div>
</div>
<div id="info" style="text-align:left;font-size:13px;color:#636e72;margin-top:8px">HEX: #6c5ce7 | RGB: 108,92,231</div>
<button class="btn" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('colorInput').value).then(()=>alert('已复制颜色值'))">📋 复制颜色</button>
</div>
<div class="pay-bar">💡 觉得好用？<a href="#">请作者喝杯咖啡 ☕</a> | 仅需1元</div>
<script>
function pick(h){document.getElementById('colorInput').value=h;updateColor(h)}
function updateColor(h){
document.getElementById('preview').style.background=h;
document.getElementById('preview').textContent=h;
const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
document.getElementById('info').textContent='HEX: '+h+' | RGB: '+r+','+g+','+b;
}
</script></body></html>
