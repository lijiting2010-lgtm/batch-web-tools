<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>密码生成器 - 强密码在线生成</title>
<meta name="description" content="免费在线密码生成器，生成高强度安全密码">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a2e;color:#eee;text-align:center}
header{background:linear-gradient(135deg,#16213e,#0f3460);color:#e94560;padding:30px 20px}
header h1{font-size:26px}
.box{background:#16213e;border-radius:12px;padding:20px;max-width:500px;margin:16px auto;text-align:left}
label{display:block;font-size:13px;color:#888;margin:8px 0 4px}
input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid #333;border-radius:6px;background:#1a1a2e;color:#eee;font-size:15px}
.btn{background:#e94560;color:white;border:none;padding:8px 20px;border-radius:6px;font-size:14px;cursor:pointer;margin:4px}
.result{background:#0f3460;padding:12px;border-radius:6px;margin:8px 0;font-family:monospace;font-size:16px;word-break:break-all}
.pay-bar{background:linear-gradient(135deg,#16213e,#e94560);color:white;padding:12px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.pay-bar a{color:#ffd700;font-weight:bold;text-decoration:none}
</style></head>
<body>
<header><h1>🔑 密码生成器</h1><p>生成高强度安全密码</p></header>
<div class="box">
<label>密码长度</label><input type="number" id="len" value="16" min="4" max="64">
<label><input type="checkbox" id="upper" checked> 包含大写字母</label>
<label><input type="checkbox" id="lower" checked> 包含小写字母</label>
<label><input type="checkbox" id="digit" checked> 包含数字</label>
<label><input type="checkbox" id="sym" checked> 包含符号</label>
<button class="btn" onclick="gen()">🔐 生成密码</button>
<div class="result" id="pw">点击生成</div>
<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('pw').textContent).then(()=>alert('已复制'))">📋 复制</button>
</div>
<div class="pay-bar">💡 觉得好用？<a href="#">请作者喝杯咖啡 ☕</a> | 仅需1元</div>
<script>
function gen(){
const l=parseInt(document.getElementById('len').value);
let chars='';
if(document.getElementById('upper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
if(document.getElementById('lower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
if(document.getElementById('digit').checked)chars+='0123456789';
if(document.getElementById('sym').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
if(!chars){document.getElementById('pw').textContent='请至少选择一种字符类型';return}
let p='';
for(let i=0;i<l;i++)p+=chars[Math.floor(Math.random()*chars.length)];
document.getElementById('pw').textContent=p;
}
</script></body></html>
