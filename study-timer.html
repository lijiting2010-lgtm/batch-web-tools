<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学习计时器 - 番茄钟在线工具</title>
<meta name="description" content="免费在线学习计时器，番茄工作法，专注学习计时。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#fef9ef;text-align:center}
header{background:linear-gradient(135deg,#f39c12,#e67e22);color:white;padding:30px 20px}
header h1{font-size:26px}
.box{background:white;border-radius:12px;padding:20px;max-width:400px;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.timer{font-size:72px;font-weight:bold;font-family:monospace;color:#e67e22;margin:16px 0}
.btn{background:#f39c12;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:4px}
.btn2{background:#86868b;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:4px}
input[type=number]{width:60px;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:15px;text-align:center}
.pay-bar{background:linear-gradient(135deg,#f39c12,#e67e22);color:white;padding:12px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.pay-bar a{color:#ffd700;font-weight:bold;text-decoration:none}
</style></head>
<body>
<header><h1>⏱️ 学习计时器</h1><p>番茄工作法，专注学习</p></header>
<div class="box">
<div class="timer" id="display">25:00</div>
<div>
<button class="btn" id="startBtn" onclick="start()">▶ 开始</button>
<button class="btn2" onclick="pause()">⏸ 暂停</button>
<button class="btn2" onclick="reset()">↺ 重置</button>
</div>
<div style="margin:12px 0"><label style="font-size:13px;color:#86868b">专注(分钟): </label><input type="number" id="minutes" value="25" min="1" max="120" onchange="reset()"></div>
<div id="status" style="font-size:14px;color:#86868b">点击开始专注学习</div>
<div style="margin-top:12px;font-size:13px;color:#86868b">今日专注: <span id="todayMin">0</span>分钟 | 番茄: <span id="tomato">0</span>个</div>
</div>
<div class="pay-bar">💡 觉得好用？<a href="#">请作者喝杯咖啡 ☕</a> | 仅需1元</div>
<script>
let timer=null,secs=25*60,running=false;
let todayMin=parseInt(localStorage.getItem('study_today')||'0');
let tomato=parseInt(localStorage.getItem('study_tomato')||'0');
document.getElementById('todayMin').textContent=todayMin;
document.getElementById('tomato').textContent=tomato;
function upd(){const m=Math.floor(secs/60),s=secs%60;document.getElementById('display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function start(){
if(running)return;
const t=parseInt(document.getElementById('minutes').value)*60;
if(secs<=0||secs>t)secs=t;
running=true;document.getElementById('startBtn').textContent='⏳ 学习中';
timer=setInterval(()=>{
secs--;upd();
if(secs<=0){
clearInterval(timer);running=false;document.getElementById('startBtn').textContent='▶ 开始';
todayMin+=parseInt(document.getElementById('minutes').value);tomato++;
localStorage.setItem('study_today',todayMin);localStorage.setItem('study_tomato',tomato);
document.getElementById('todayMin').textContent=todayMin;document.getElementById('tomato').textContent=tomato;
document.getElementById('status').innerHTML='🎉 完成一个番茄钟！休息一下 ☕';
document.getElementById('display').style.color='#27ae60';
}},1000);
}
function pause(){clearInterval(timer);running=false;document.getElementById('startBtn').textContent='▶ 继续'}
function reset(){clearInterval(timer);running=false;secs=parseInt(document.getElementById('minutes').value)*60;upd();document.getElementById('startBtn').textContent='▶ 开始';document.getElementById('display').style.color='#e67e22';document.getElementById('status').textContent='已重置'}
upd();
</script></body></html>
