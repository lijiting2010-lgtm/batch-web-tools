<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在线抽奖转盘 - 幸运转盘</title>
<meta name="description" content="免费在线抽奖转盘，幸运转盘抽奖工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#fff5f5;text-align:center}
header{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:white;padding:30px 20px}
header h1{font-size:26px}
.box{background:white;border-radius:12px;padding:20px;max-width:450px;margin:16px auto;box-shadow:0 2px 10px rgba(0,0,0,.05)}
canvas{border-radius:50%;max-width:100%}
.btn{background:#ff6b6b;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:8px}
.result{background:#fff5f5;border-radius:8px;padding:16px;margin:12px 0;font-size:16px}
.pay-bar{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:white;padding:12px;position:fixed;bottom:0;left:0;right:0;z-index:100}
.pay-bar a{color:#ffd700;font-weight:bold;text-decoration:none}
</style></head>
<body>
<header><h1>🎯 在线抽奖转盘</h1><p>幸运转盘随机抽奖</p></header>
<div class="box">
<canvas id="wheel" width="280" height="280"></canvas>
<div><button class="btn" onclick="spin()">🎰 开始抽奖</button></div>
<div class="result" id="result">点击按钮抽奖</div>
</div>
<div class="pay-bar">💡 想要更多功能？<a href="#">请作者喝杯咖啡 ☕</a> | 仅需1元</div>
<script>
const c=document.getElementById('wheel'),ctx=c.getContext('2d');
let spinning=false;
const prizes=['一等奖','二等奖','三等奖','幸运奖','再来一次','谢谢参与'];
const colors=['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd'];
function drawWheel(angle){
const n=prizes.length,arc=Math.PI*2/n;
ctx.clearRect(0,0,280,280);
for(let i=0;i<n;i++){
ctx.beginPath();ctx.moveTo(140,140);
ctx.arc(140,140,130,i*arc+angle,(i+1)*arc+angle);
ctx.fillStyle=colors[i];ctx.fill();ctx.stroke();
ctx.fillStyle='#fff';ctx.font='11px Arial';
ctx.save();ctx.translate(140,140);ctx.rotate(i*arc+arc/2+angle);
ctx.textAlign='right';ctx.fillText(prizes[i],120,4);ctx.restore();
}
ctx.beginPath();ctx.arc(140,140,12,0,Math.PI*2);
ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
}
drawWheel(0);
function spin(){
if(spinning)return;spinning=true;
const rot=5+Math.random()*3,target=rot*Math.PI*2+Math.random()*Math.PI*2;
const start=Date.now(),dur=3000;
function anim(){
const p=Math.min((Date.now()-start)/dur,1),ease=1-Math.pow(1-p,3);
const angle=target*ease;drawWheel(angle);
if(p<1)requestAnimationFrame(anim);
else{
const idx=Math.floor(((angle%(Math.PI*2))/Math.PI*2*prizes.length))%prizes.length;
const win=prizes[(prizes.length-1-idx)%prizes.length];
document.getElementById('result').innerHTML='🎉 恭喜: <strong>'+win+'</strong> 🎉';spinning=false;
}
}
anim();
}
</script></body></html>
